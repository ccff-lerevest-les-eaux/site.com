<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Plan des zones à débroussailler autour d'une habitation</title>
  <desc id="d">Vue de dessus : une maison au centre, une zone de 50 mètres à débroussailler tout autour, une voie privée avec 10 mètres de chaque côté, et une partie de la zone qui déborde chez le voisin.</desc>

  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0b1f3a"/>
    </marker>
  </defs>

  <!-- Végétation naturelle -->
  <rect width="800" height="560" fill="#dcead6"/>
  <g fill="#2f6b4a" stroke="#1f4d36" stroke-width="1.5">
    <circle cx="95" cy="130" r="18"/><circle cx="30" cy="190" r="20"/><circle cx="110" cy="235" r="22"/>
    <circle cx="40" cy="400" r="22"/><circle cx="100" cy="445" r="19"/><circle cx="30" cy="500" r="18"/>
    <circle cx="160" cy="70" r="17"/><circle cx="225" cy="130" r="19"/><circle cx="250" cy="45" r="20"/>
    <circle cx="330" cy="30" r="21"/><circle cx="470" cy="28" r="20"/><circle cx="560" cy="48" r="22"/>
    <circle cx="650" cy="62" r="19"/><circle cx="720" cy="125" r="21"/><circle cx="765" cy="200" r="18"/>
    <circle cx="700" cy="262" r="22"/><circle cx="755" cy="335" r="20"/><circle cx="300" cy="540" r="20"/>
    <circle cx="500" cy="545" r="19"/><circle cx="180" cy="160" r="17"/><circle cx="610" cy="130" r="19"/>
    <circle cx="640" cy="200" r="17"/><circle cx="610" cy="330" r="18"/><circle cx="520" cy="505" r="18"/>
    <circle cx="200" cy="430" r="19"/><circle cx="200" cy="200" r="17"/>
  </g>

  <!-- Bande de 10 m le long de la voie privée -->
  <rect x="348" y="300" width="104" height="260" fill="#ffe3c2" stroke="#ff7a00" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- Zone de 50 m autour de la maison -->
  <circle cx="400" cy="290" r="190" fill="#ffe3c2" stroke="#ff7a00" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- Voie privée -->
  <rect x="386" y="312" width="28" height="248" fill="#8a929b"/>
  <line x1="400" y1="320" x2="400" y2="560" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 10"/>

  <!-- Limite de votre terrain -->
  <rect x="285" y="195" width="230" height="190" fill="none" stroke="#0b1f3a" stroke-width="2.5" stroke-dasharray="3 5"/>

  <!-- Arbres conservés (espacés) -->
  <g fill="#6fae85" stroke="#2f6b4a" stroke-width="1.5">
    <circle cx="322" cy="238" r="11"/><circle cx="478" cy="236" r="11"/>
    <circle cx="330" cy="352" r="11"/><circle cx="472" cy="352" r="11"/>
    <circle cx="245" cy="250" r="11"/><circle cx="560" cy="300" r="11"/>
  </g>

  <!-- Maison -->
  <rect x="365" y="262" width="70" height="50" rx="4" fill="#0b1f3a"/>
  <rect x="372" y="269" width="56" height="36" rx="2" fill="none" stroke="#ff7a00" stroke-width="2"/>
  <text x="400" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Maison</text>

  <!-- Cote 50 m -->
  <line x1="436" y1="290" x2="590" y2="290" stroke="#0b1f3a" stroke-width="2" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="512" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f3a" stroke="#ffe3c2" stroke-width="4" paint-order="stroke">50 m</text>

  <!-- Cote 10 m -->
  <line x1="415" y1="430" x2="451" y2="430" stroke="#0b1f3a" stroke-width="2" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="458" y="435" font-size="15" font-weight="700" fill="#0b1f3a" stroke="#dcead6" stroke-width="4" paint-order="stroke">10 m</text>

  <!-- Titre -->
  <rect x="18" y="18" width="360" height="42" rx="10" fill="#0b1f3a"/>
  <text x="34" y="45" font-size="18" font-weight="700" fill="#ff7a00">PLAN TYPE : OÙ DÉBROUSSAILLER ?</text>
  <text x="20" y="80" font-size="12" font-weight="700" fill="#0b1f3a" stroke="#dcead6" stroke-width="4" paint-order="stroke">Schéma de principe, non à l'échelle</text>

  <!-- Étiquette zone -->
  <rect x="300" y="142" width="200" height="26" rx="13" fill="#ffffff" stroke="#ff7a00" stroke-width="2"/>
  <text x="400" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1f3a">Zone à débroussailler</text>

  <!-- Chez le voisin -->
  <rect x="18" y="300" width="190" height="64" rx="10" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
  <text x="30" y="324" font-size="13" font-weight="700" fill="#0b1f3a">Chez le voisin aussi :</text>
  <text x="30" y="342" font-size="13" fill="#0b1f3a">l'obligation dépasse</text>
  <text x="30" y="358" font-size="13" fill="#0b1f3a">votre limite de terrain</text>
  <line x1="208" y1="332" x2="262" y2="302" stroke="#0b1f3a" stroke-width="2"/>
  <circle cx="262" cy="302" r="4" fill="#0b1f3a"/>

  <!-- Voie privée -->
  <rect x="150" y="470" width="185" height="48" rx="10" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
  <text x="162" y="491" font-size="13" font-weight="700" fill="#0b1f3a">Voie privée d'accès :</text>
  <text x="162" y="508" font-size="13" fill="#0b1f3a">10 m de chaque côté</text>
  <line x1="335" y1="494" x2="368" y2="494" stroke="#0b1f3a" stroke-width="2"/>
  <circle cx="368" cy="494" r="4" fill="#0b1f3a"/>

  <!-- Légende -->
  <rect x="548" y="392" width="236" height="156" rx="12" fill="#ffffff" fill-opacity="0.96" stroke="#0b1f3a" stroke-width="2"/>
  <rect x="562" y="406" width="26" height="16" rx="3" fill="#ffe3c2" stroke="#ff7a00" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="598" y="419" font-size="13" fill="#0b1f3a">Zone à débroussailler</text>
  <rect x="562" y="434" width="26" height="16" rx="3" fill="#8a929b"/>
  <text x="598" y="447" font-size="13" fill="#0b1f3a">Voie privée d'accès</text>
  <line x1="562" y1="470" x2="588" y2="470" stroke="#0b1f3a" stroke-width="2.5" stroke-dasharray="3 4"/>
  <text x="598" y="475" font-size="13" fill="#0b1f3a">Limite de terrain</text>
  <circle cx="575" cy="496" r="9" fill="#2f6b4a" stroke="#1f4d36" stroke-width="1.5"/>
  <text x="598" y="501" font-size="13" fill="#0b1f3a">Forêt, maquis</text>
  <circle cx="575" cy="524" r="8" fill="#6fae85" stroke="#2f6b4a" stroke-width="1.5"/>
  <text x="598" y="529" font-size="13" fill="#0b1f3a">Arbres conservés, espacés</text>
</svg>
